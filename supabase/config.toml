# Supabase local CLI config — proyecto remoto "togesc"
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "puetlvcsrntwweuxinee"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://togesc.vercel.app"
additional_redirect_urls = [
  "http://localhost:*",
  "https://togesc.vercel.app/**",
  # Vuelta de los enlaces de Auth a la app en Android e iOS.
  "com.raikadier.togesc://login-callback",
]

# En el plan Free, Supabase solo deja cambiar las plantillas con SMTP propio.
