<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f6f4fa;font-family:Arial,Helvetica,sans-serif;color:#1c1a22">

    <h1 style="margin:0 0 16px;font-size:22px">Confirma tu cuenta de TOGESC</h1>

    <p style="margin:0;font-size:13px;line-height:1.5;color:#5f5a6b">Si no creaste esta cuenta, ignora este mensaje.</p>
